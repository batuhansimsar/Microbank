version: '3.8'

services:
  # PostgreSQL Databases
  identity-db:
    image: postgres:16-alpine
    container_name: microbank-identity-db
    environment:
      POSTGRES_DB: microbank_identity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5532:5432"
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    networks:
      - microbank-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  account-db:
    image: postgres:16-alpine
    container_name: microbank-account-db
    environment:
      POSTGRES_DB: microbank_account
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5533:5432"
    volumes:
      - account-db-data:/var/lib/postgresql/data
    networks:
      - microbank-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  transfer-db:
    image: postgres:16-alpine
    container_name: microbank-transfer-db
    environment:
      POSTGRES_DB: microbank_transfer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5534:5432"
    volumes:
      - transfer-db-data:/var/lib/postgresql/data
    networks:
      - microbank-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: microbank-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - microbank-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis for Distributed Locking
  redis:
    image: redis:7-alpine
    container_name: microbank-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - microbank-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Identity Service
  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity/Dockerfile
    container_name: microbank-identity-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=identity-db;Port=5432;Database=microbank_identity;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379,abortConnect=false
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=MicrobankIdentity
      - JwtSettings__Audience=MicrobankServices
      - JwtSettings__ExpirationMinutes=60
    ports:
      - "5001:80"
    depends_on:
      identity-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - microbank-network
    restart: on-failure

  # Account Service
  account-api:
    build:
      context: .
      dockerfile: src/Services/Account/Dockerfile
    container_name: microbank-account-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=account-db;Port=5432;Database=microbank_account;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379,abortConnect=false
      - RabbitMQ__Host=rabbitmq
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=MicrobankIdentity
      - JwtSettings__Audience=MicrobankServices
    ports:
      - "5002:80"
    depends_on:
      account-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - microbank-network
    restart: on-failure

  # Transfer Service - SAGA Orchestrator
  transfer-api:
    build:
      context: .
      dockerfile: src/Services/Transfer/Dockerfile
    container_name: microbank-transfer-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=transfer-db;Port=5432;Database=microbank_transfer;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379,abortConnect=false
      - RabbitMQ__Host=rabbitmq
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=MicrobankIdentity
      - JwtSettings__Audience=MicrobankServices
    ports:
      - "5003:80"
    depends_on:
      transfer-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - microbank-network
    restart: on-failure

  # Notification Service
  notification-api:
    build:
      context: .
      dockerfile: src/Services/Notification/Dockerfile
    container_name: microbank-notification-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=rabbitmq
    ports:
      - "5004:80"
    depends_on:
      - rabbitmq
    networks:
      - microbank-network

  # API Gateway
  gateway-api:
    build:
      context: .
      dockerfile: src/ApiGateways/Dockerfile
    container_name: microbank-gateway-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=MicrobankIdentity
      - JwtSettings__Audience=MicrobankServices
    ports:
      - "8080:80"
    depends_on:
      - identity-api
      - account-api
      - transfer-api
    networks:
      - microbank-network
    restart: on-failure

networks:
  microbank-network:
    driver: bridge

volumes:
  identity-db-data:
  account-db-data:
  transfer-db-data:
  rabbitmq-data:
  redis-data:
